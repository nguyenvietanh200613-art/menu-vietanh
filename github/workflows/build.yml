name: Build iOS Dylib

on: [push]

jobs:
  build:
    runs-on: macos-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Create Source File
      run: |
        cat << 'EOF' > menu.m
        #import <UIKit/UIKit.h>
        #import <Foundation/Foundation.h>

        static BOOL g_menuVisible = NO;
        static UIWindow *g_onyxWindow = nil;

        @interface OnyxMenuView : UIView
        @property (strong, nonatomic) UIButton *floatingButton;
        @property (strong, nonatomic) UIView *panelView;
        @end

        @implementation OnyxMenuView
        - (instancetype)initWithFrame:(CGRect)frame {
            self = [super initWithFrame:frame];
            if (self) {
                self.userInteractionEnabled = YES;
                UITapGestureRecognizer *tripleTap = [[UITapGestureRecognizer alloc] initWithTarget:self action:@selector(handleTripleTap:)];
                tripleTap.numberOfTouchesRequired = 3;
                [self addGestureRecognizer:tripleTap];
                [self setupFloatingButton];
                [self setupPanel];
            }
            return self;
        }
        - (void)handleTripleTap:(UITapGestureRecognizer *)sender {
            g_menuVisible = !g_menuVisible;
            self.panelView.hidden = !g_menuVisible;
        }
        - (void)setupFloatingButton {
            self.floatingButton = [UIButton buttonWithType:UIButtonTypeCustom];
            self.floatingButton.frame = CGRectMake(30, 100, 55, 55);
            self.floatingButton.backgroundColor = [UIColor colorWithRed:0.05 green:0.05 blue:0.05 alpha:0.9];
            [self.floatingButton setTitle:@"ONYX" forState:UIControlStateNormal];
            [self.floatingButton setTitleColor:[UIColor redColor] forState:UIControlStateNormal];
            self.floatingButton.titleLabel.font = [UIFont boldSystemFontOfSize:12];
            self.floatingButton.layer.cornerRadius = 27.5f;
            self.floatingButton.layer.borderWidth = 2.0f;
            self.floatingButton.layer.borderColor = [UIColor redColor].CGColor;
            [self addSubview:self.floatingButton];
        }
        - (void)setupPanel {
            self.panelView = [[UIView alloc] initWithFrame:CGRectMake(100, 80, 310, 420)];
            self.panelView.backgroundColor = [UIColor colorWithRed:0.08 green:0.08 blue:0.08 alpha:0.96];
            self.panelView.layer.cornerRadius = 14.0f;
            self.panelView.layer.borderWidth = 1.5f;
            self.panelView.layer.borderColor = [UIColor redColor].CGColor;
            self.panelView.hidden = YES;
            
            UILabel *title = [[UILabel alloc] initWithFrame:CGRectMake(10, 10, 290, 30)];
            title.text = @"🔥 ONYX VIP - FREE FIRE MENU 🔥";
            title.textColor = [UIColor whiteColor];
            title.font = [UIFont boldSystemFontOfSize:13];
            title.textAlignment = NSTextAlignmentCenter;
            [self.panelView addSubview:title];
            [self addSubview:self.panelView];
        }
        @end

        @interface OnyxViewController : UIViewController
        @end
        @implementation OnyxViewController
        - (BOOL)shouldAutorotate { return YES; }
        - (UIInterfaceOrientationMask)supportedInterfaceOrientations { return UIInterfaceOrientationMaskLandscape; }
        @end

        __attribute__((constructor)) void onyxEntry() {
            dispatch_after(dispatch_time(DISPATCH_TIME_NOW, (int64_t)(1.0 * NSEC_PER_SEC)), dispatch_get_main_queue(), ^{
                UIWindow *win = [[UIWindow alloc] initWithFrame:[UIScreen mainScreen].bounds];
                win.windowLevel = UIWindowLevelStatusBar + 99999;
                win.backgroundColor = [UIColor clearColor];
                win.rootViewController = [[OnyxViewController alloc] init];
                [win.rootViewController.view addSubview:[[OnyxMenuView alloc] initWithFrame:win.bounds]];
                win.hidden = NO;
                [win makeKeyAndVisible];
            });
        }
        EOF

    - name: Compile Dylib
      run: |
        xcrun -sdk iphoneos clang -arch arm64 -dynamiclib -undefined dynamic_lookup menu.m -o vietanh.dylib -framework UIKit -framework Foundation -framework CoreGraphics

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: vietanh-dylib
        path: vietanh.dylib
